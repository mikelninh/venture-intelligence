name: Import Venture Intelligence v0.5 source
on:
  push:
    paths:
      - "_bootstrap/release.tar.gz.b64"
      - ".github/workflows/bootstrap-import.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Unpack audited project archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, io, tarfile, pathlib
          root = pathlib.Path.cwd().resolve()
          encoded = ''.join(pathlib.Path('_bootstrap/release.tar.gz.b64').read_text().split())
          payload = base64.b64decode(encoded, validate=True)
          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as tf:
              members = tf.getmembers()
              files = [m for m in members if m.isfile()]
              assert len(files) == 76, f"Expected 76 project files, got {len(files)}"
              for m in members:
                  p = pathlib.PurePosixPath(m.name)
                  if m.name.startswith('/') or '..' in p.parts or not m.isfile():
                      raise RuntimeError(f"Unsafe archive member: {m.name}")
                  if p.parts[:2] == ('backend', 'data'):
                      raise RuntimeError("Local database must never be committed")
              for m in files:
                  destination = root / m.name
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with tf.extractfile(m) as src, destination.open('wb') as dst:
                      dst.write(src.read())
          print(f"Restored {len(files)} safe project files.")
          PY
          test -f backend/app/workflow.py
          test -f backend/evals/gold.json
          test -f backend/demo/novasense.pdf
          test -f .github/workflows/ci.yml
          python3 -m compileall -q backend/app
          node --check frontend/standalone/app.js
      - name: Commit imported source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf _bootstrap
          rm .github/workflows/bootstrap-import.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'feat: publish complete evidence-first Venture Intelligence v0.5'
            git push origin HEAD:main
          fi
