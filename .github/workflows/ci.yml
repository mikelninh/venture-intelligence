name: Venture Intelligence v0.5 — verified workflow
on:
  push:
    paths:
      - 'backend/**'
      - 'frontend/standalone/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install LangGraph and test requirements
        run: python -m pip install -r backend/requirements-agent.txt -r backend/requirements-dev.txt
      - name: Test against committed, unchanged synthetic fixtures and gold labels
        run: test -f backend/evals/gold.json && test -f backend/demo/novasense.pdf
      - name: Prove real LangGraph pipeline
        env:
          PYTHONPATH: .:backend
          VI_WORKFLOW_ENGINE: langgraph
        run: python -m pytest -q backend/tests
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check browser app syntax
        run: node --check frontend/standalone/app.js
