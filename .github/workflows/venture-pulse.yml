name: Venture Pulse — daily public change detection
on:
  push:
    paths:
      - 'backend/app/pulse.py'
      - 'backend/tests/test_pulse.py'
      - '.github/workflows/venture-pulse.yml'
  workflow_dispatch:
  schedule:
    # 07:30 UTC daily (08:30 CET / 09:30 CEST), GitHub may delay cron
    - cron: '30 7 * * *'
permissions:
  contents: write
concurrency:
  group: venture-pulse-refresh
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest==8.4.2
      - name: Verify change detector
        run: python -m pytest -q backend/tests/test_pulse.py
      - name: Fetch approved public RSS sources
        run: python -m backend.app.pulse --state data/pulse/state.json --output data/pulse/latest.json
      - name: Commit the two generated snapshots only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pulse/state.json data/pulse/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(pulse): daily public source snapshot [skip ci]'
            git push
          fi
